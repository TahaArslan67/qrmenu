<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli - Gözde Pide</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <nav class="admin-navbar">
        <div class="nav-brand"><span class="brand-icon">GP</span> Gözde Pide</div>
        <div class="nav-links">
            <a href="/admin" class="active">Menü</a>
            <a href="/admin/orders">Siparişler</a>
            <a href="/admin/campaigns">Kampanyalar</a>
            <a href="/admin/reports">Raporlar</a>
        </div>
        <a href="/logout" class="nav-logout">Çıkış</a>
    </nav>
    <div class="admin-content">
        <div class="page-title">Menü Yönetimi</div>
        
        <div class="card" id="ai-section">
            <h2>AI ile Menü Güncelle</h2>
            <form id="ai-form">
                <div class="form-group">
                    <textarea id="ai-prompt" placeholder="Örn: Adana Kebabın fiyatını 300 yap, yeni bir Tatlılar kategorisi ekle..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <input type="file" id="ai-image" accept="image/*">
                </div>
                <button type="button" id="ai-submit" class="btn btn-blue">AI ile Önizle</button>
            </form>
            <div id="ai-result"></div>
            <div id="ai-preview">
                <h3>AI Önerileri</h3>
                <ul id="ai-preview-list"></ul>
                <button type="button" id="ai-confirm" class="btn btn-green">Onayla ve Uygula</button>
                <button type="button" id="ai-cancel" class="btn btn-red">İptal</button>
            </div>
        </div>
        
        <div class="card" id="category-form-card">
            <h2 id="category-form-title">Kategori Ekle</h2>
            <form method="post" action="/add_category" id="category-form">
                <input type="hidden" name="category_id" id="category-id">
                <div class="form-group"><input type="text" name="name" placeholder="Kategori adı" required id="category-name"></div>
                <div class="form-group"><input type="number" name="category_num" placeholder="Sıra numarası" required value="0" id="category-num"></div>
                <div class="form-group"><input type="url" name="img_url" placeholder="Kategori görsel URL (opsiyonel)" id="category-img-url"></div>
                <button type="submit" id="category-submit-btn" class="btn btn-primary">Kategori Ekle</button>
                <button type="button" id="cancel-category-edit" class="btn btn-red" style="display:none;">İptal</button>
            </form>
        </div>
        
        <div class="card">
            <h2 id="categories-section">Kategoriler</h2>
            <table id="categories-table">
                <thead>
                    <tr>
                        <th>Kategori Adı</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- CATEGORIES_LIST -->
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h2 id="item-add-section">Ürün Ekle</h2>
            <form method="post" action="/add_item" id="item-form">
                <input type="hidden" name="item_id" id="item-id">
                <div class="form-group"><input type="text" name="name" placeholder="Ürün adı" required id="item-name"></div>
                <div class="form-group"><textarea name="description" placeholder="Açıklama" id="item-description"></textarea></div>
                <div class="form-group"><input type="number" name="price" placeholder="Fiyat" step="0.01" required id="item-price"></div>
                <label class="checkbox-label">
                    <input type="checkbox" name="is_featured" value="1" id="item-is-featured">
                    <span>Öne çıkan ürün olarak işaretle</span>
                </label>
                <div class="form-group">
                    <select name="category_id" required id="category-select">
                        <option value="">Kategori seçin</option>
                        <!-- CATEGORIES_OPTIONS -->
                    </select>
                </div>
                <button type="submit" id="item-submit-btn" class="btn btn-primary">Ürün Ekle</button>
                <button type="button" id="cancel-edit" class="btn btn-red" style="display:none;">İptal</button>
            </form>
        </div>
        
        <div class="card">
            <h2 id="items-section">Ürünler</h2>
            <div id="category-filter" class="cat-filter"></div>
            <input type="text" id="product-search" class="search-input" placeholder="Ürün ara..." autocomplete="off">
            <table id="items-table">
                <thead>
                    <tr>
                        <th>Ürün Adı</th>
                        <th>Kategori</th>
                        <th>Fiyat</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ITEMS_LIST -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="/static/admin-notifications.js"></script>
    
    <script>
        // Kategori seçme sorununu kontrol etmek için debug bilgisi
        console.log('Kategori seçim listesi:', document.getElementById('category-select'));
        console.log('Kategoriler tablosu:', document.getElementById('categories-table'));
        
        // Form gönderilmeden önce kontrol
        document.querySelector('form[action="/add_item"]').addEventListener('submit', function(e) {
            const categoryId = document.querySelector('select[name="category_id"]').value;
            console.log('Seçilen kategori ID:', categoryId);
            
            if (!categoryId) {
                e.preventDefault();
                alert('Lütfen bir kategori seçin!');
                return false;
            }
        });

        // Kategori düzenleme işlevi
        function editCategory(categoryId, name, categoryNum) {
            const cat = (window.adminCategories || []).find(c => c._id === categoryId);
            document.getElementById('category-id').value = categoryId;
            document.getElementById('category-name').value = name || '';
            document.getElementById('category-num').value = categoryNum || 0;
            document.getElementById('category-img-url').value = cat && cat.img_url ? cat.img_url : '';
            document.getElementById('category-form-title').textContent = 'Kategori Düzenle';
            document.getElementById('category-submit-btn').textContent = 'Kategoriyi Güncelle';
            document.getElementById('category-form').action = '/edit_category';
            document.getElementById('cancel-category-edit').style.display = 'inline-block';
            document.getElementById('category-form').scrollIntoView({behavior: 'smooth'});
        }

        document.getElementById('cancel-category-edit').addEventListener('click', function() {
            document.getElementById('category-form').reset();
            document.getElementById('category-id').value = '';
            document.getElementById('category-form-title').textContent = 'Kategori Ekle';
            document.getElementById('category-submit-btn').textContent = 'Kategori Ekle';
            document.getElementById('category-form').action = '/add_category';
            document.getElementById('cancel-category-edit').style.display = 'none';
        });

        // Düzenleme işlevi
        function editItem(itemId) {
            const item = (window.adminItems || []).find(i => i._id === itemId);
            const categories = window.adminCategories || [];
            if (!item) return;
            
            // Form alanlarını doldur
            document.getElementById('item-id').value = item._id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-description').value = item.description || '';
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-is-featured').checked = !!item.is_featured;
            
            const cat = categories.find(c => Number(String(c.category_num || '')) === Number(String(item.category_id || '')) || c._id === item.category_id);
            document.getElementById('category-select').value = cat ? cat._id : '';
            
            // Form başlığını ve buton metnini güncelle
            document.getElementById('item-submit-btn').textContent = 'Ürünü Güncelle';
            document.getElementById('item-form').action = '/edit_item';
            document.getElementById('cancel-edit').style.display = 'inline-block';
            
            // Sayfayı form alanına kaydır
            document.getElementById('item-form').scrollIntoView({behavior: 'smooth'});
        }

        // İptal butonu işlevi
        document.getElementById('cancel-edit').addEventListener('click', function() {
            // Formu temizle
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = '';
            
            // Form başlığını ve buton metnini sıfırla
            document.getElementById('item-submit-btn').textContent = 'Ürün Ekle';
            document.getElementById('item-form').action = '/add_item';
            document.getElementById('cancel-edit').style.display = 'none';
        });
        // Kategori filtreleme
        function renderCategoryFilters() {
            const container = document.getElementById('category-filter');
            const categories = window.adminCategories || [];
            if (categories.length === 0) return;
            
            const allBtn = document.createElement('button');
            allBtn.textContent = 'Tümü';
            allBtn.type = 'button';
            allBtn.style.cssText = 'background:#e53935;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;';
            allBtn.dataset.category = '';
            allBtn.addEventListener('click', function() { setCategoryFilter(''); });
            container.appendChild(allBtn);
            
            categories.forEach(function(cat) {
                const btn = document.createElement('button');
                btn.textContent = cat.name;
                btn.type = 'button';
                btn.style.cssText = 'background:#fff;color:#333;border:1px solid #ddd;padding:6px 12px;border-radius:4px;cursor:pointer;';
                btn.dataset.category = cat.name;
                btn.addEventListener('click', function() { setCategoryFilter(cat.name); });
                container.appendChild(btn);
            });
        }
        
        let activeCategory = '';
        function setCategoryFilter(category) {
            activeCategory = category;
            document.querySelectorAll('#category-filter button').forEach(function(btn) {
                const isActive = (btn.dataset.category === category || (category === '' && btn.dataset.category === ''));
                btn.style.backgroundColor = isActive ? '#e53935' : '#fff';
                btn.style.color = isActive ? '#fff' : '#333';
                btn.style.border = isActive ? 'none' : '1px solid #ddd';
            });
            applyFilters();
        }
        
        function applyFilters() {
            const term = document.getElementById('product-search').value.toLowerCase().trim();
            document.querySelectorAll('#items-table tbody tr').forEach(function(row) {
                const category = row.getAttribute('data-category') || '';
                const name = (row.getAttribute('data-name') || '').toLowerCase();
                const matchesCategory = !activeCategory || category === activeCategory;
                const matchesName = !term || name.includes(term);
                row.style.display = (matchesCategory && matchesName) ? '' : 'none';
            });
        }
        
        renderCategoryFilters();
        
        // Ürün arama
        document.getElementById('product-search').addEventListener('input', applyFilters);

        // AI güncelleme
        let aiOperations = [];
        const aiPreview = document.getElementById('ai-preview');
        const aiPreviewList = document.getElementById('ai-preview-list');
        const aiResult = document.getElementById('ai-result');

        function formatOp(op) {
            const d = op.data || {};
            const target = op.target_name || '';
            const name = d.name !== undefined ? String(d.name) : target;
            const price = d.price !== undefined ? String(d.price) + ' ₺' : '';
            const categoryName = d.category_name ? String(d.category_name) : '';
            const categoryNum = d.category_num !== undefined ? 'Sıra: ' + String(d.category_num) : '';
            switch (op.action) {
                case 'add_category':
                    return 'Kategori ekle: ' + name + (categoryNum ? ' (' + categoryNum + ')' : '');
                case 'update_category':
                    return 'Kategori güncelle: ' + target + (name !== target ? ' -> ' + name : '') + (categoryNum ? ' (' + categoryNum + ')' : '');
                case 'delete_category':
                    return 'Kategori sil: ' + target;
                case 'add_item':
                    return 'Ürün ekle: ' + name + (price ? ' - ' + price : '') + (categoryName ? ' (' + categoryName + ')' : '');
                case 'update_item':
                    return 'Ürün güncelle: ' + target + (name !== target ? ' -> ' + name : '') + (price ? ' - ' + price : '') + (categoryName ? ' (' + categoryName + ')' : '');
                case 'delete_item':
                    return 'Ürün sil: ' + target;
                default:
                    return op.action + (target ? ' (' + target + ')' : '');
            }
        }

        function showPreview(operations) {
            aiOperations = operations || [];
            aiPreviewList.innerHTML = '';
            if (aiOperations.length === 0) {
                aiPreviewList.innerHTML = '<li>AI herhangi bir işlem önermedi.</li>';
            } else {
                aiOperations.forEach(function(op) {
                    const li = document.createElement('li');
                    li.textContent = formatOp(op);
                    li.style.padding = '4px 0';
                    li.style.borderBottom = '1px solid #eee';
                    aiPreviewList.appendChild(li);
                });
            }
            aiPreview.style.display = 'block';
        }

        function clearPreview() {
            aiOperations = [];
            aiPreview.style.display = 'none';
            aiPreviewList.innerHTML = '';
            aiResult.style.display = 'none';
            aiResult.textContent = '';
        }

        document.getElementById('ai-submit').addEventListener('click', async function() {
            const prompt = document.getElementById('ai-prompt').value;
            const fileInput = document.getElementById('ai-image');
            aiResult.style.display = 'block';
            aiResult.textContent = 'AI analiz ediyor...';
            aiPreview.style.display = 'none';

            const doPreview = async function(imageData) {
                try {
                    const res = await fetch('/ai_update', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt, image_data: imageData || '' })
                    });
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    const data = await res.json();
                    aiResult.textContent = data.success ? 'Önizleme hazır. Değişiklikleri kontrol edip onaylayın.' : (data.message || 'Hata oluştu');
                    if (data.success) {
                        showPreview(data.operations);
                    }
                } catch (err) {
                    aiResult.textContent = 'Hata: ' + err.message;
                }
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { doPreview(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                await doPreview('');
            }
        });

        document.getElementById('ai-confirm').addEventListener('click', async function() {
            if (!aiOperations.length) return;
            aiResult.textContent = 'Uygulanıyor...';
            try {
                const res = await fetch('/ai_apply', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ operations: aiOperations })
                });
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                aiResult.textContent = data.message || (data.success ? 'Tamamlandı' : 'Hata oluştu');
                if (data.success) {
                    setTimeout(function() { window.location.reload(); }, 1200);
                }
            } catch (err) {
                aiResult.textContent = 'Hata: ' + err.message;
            }
        });

        document.getElementById('ai-cancel').addEventListener('click', function() {
            clearPreview();
        });
    </script>
    <!-- ADMIN_ITEMS_DATA -->
</body>
</html>
